<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - SportConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-running me-2"></i> SportConnect
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">Complete Your Payment</h2>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card booking-summary">
                        <div class="card-body">
                            <h4 class="mb-4">Booking Summary</h4>
                            <div id="bookingSummary">
                                <div class="text-center">
                                    <div class="spinner-border" role="status"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="mb-4">Payment Method</h4>
                            <form id="paymentForm">
                                <div class="mb-3">
                                    <label class="form-label">Select Payment Method</label>
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="radio" name="paymentMethod" id="card" value="card" checked>
                                        <label class="form-check-label" for="card">
                                            <i class="fas fa-credit-card me-2"></i>Credit/Debit Card
                                        </label>
                                    </div>
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="radio" name="paymentMethod" id="upi" value="upi">
                                        <label class="form-check-label" for="upi">
                                            <i class="fas fa-mobile-alt me-2"></i>UPI
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="paymentMethod" id="netbanking" value="netbanking">
                                        <label class="form-check-label" for="netbanking">
                                            <i class="fas fa-university me-2"></i>Net Banking
                                        </label>
                                    </div>
                                </div>
                                
                                <div id="cardDetails">
                                    <div class="mb-3">
                                        <label class="form-label">Card Number</label>
                                        <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Expiry Date</label>
                                            <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY" maxlength="5">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">CVV</label>
                                            <input type="text" class="form-control" id="cvv" placeholder="123" maxlength="3">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Name on Card</label>
                                        <input type="text" class="form-control" id="cardName">
                                    </div>
                                </div>
                                
                                <div id="upiDetails" style="display:none;">
                                    <div class="mb-3">
                                        <label class="form-label">UPI ID</label>
                                        <input type="text" class="form-control" id="upiId" placeholder="yourname@upi">
                                    </div>
                                </div>
                                
                                <div id="netbankingDetails" style="display:none;">
                                    <div class="mb-3">
                                        <label class="form-label">Select Bank</label>
                                        <select class="form-select" id="bank">
                                            <option value="">Select Bank</option>
                                            <option value="sbi">State Bank of India</option>
                                            <option value="hdfc">HDFC Bank</option>
                                            <option value="icici">ICICI Bank</option>
                                            <option value="axis">Axis Bank</option>
                                            <option value="kotak">Kotak Mahindra Bank</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100 btn-lg">Pay Now</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>SportConnect</h5>
                    <p>Your one-stop solution for sports facility booking</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>&copy; 2024 SportConnect. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/payment.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadPaymentDetails();
        });
        
        document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('cardDetails').style.display = this.value === 'card' ? 'block' : 'none';
                document.getElementById('upiDetails').style.display = this.value === 'upi' ? 'block' : 'none';
                document.getElementById('netbankingDetails').style.display = this.value === 'netbanking' ? 'block' : 'none';
            });
        });
        
        document.getElementById('paymentForm').addEventListener('submit', handlePayment);
    </script>
</body>
</html>
