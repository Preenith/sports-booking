<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SportConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-futbol"></i> SportConnect
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="facilities.html">Facilities</a>
                    </li>
                    <li class="nav-item" id="authLinks">
                        <a class="nav-link" href="login.html">Login</a>
                        <a class="nav-link" href="signup.html">Sign Up</a>
                    </li>
                    <li class="nav-item" id="userLinks" style="display: none;">
                        <a class="nav-link" href="my-bookings.html">My Bookings</a>
                        <a class="nav-link active" href="profile.html">Profile</a>
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Profile Section -->
    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4" id="profileContainer">
                    <div class="text-center">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 SportConnect. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        window.onload = function() {
            checkAuth();
            loadProfile();
        };

        function loadProfile() {
            const token = localStorage.getItem('token');
            
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            fetch('/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
            .then(data => {
                displayProfile(data.user);
            })
            .catch(error => {
                console.error('Error loading profile:', error);
                document.getElementById('profileContainer').innerHTML = 
                    '<div class="alert alert-danger">Failed to load profile</div>';
            });
        }

        function displayProfile(user) {
            const container = document.getElementById('profileContainer');
            
            container.innerHTML = `
                <div class="text-center mb-4">
                    <div style="width: 100px; height: 100px; background: linear-gradient(135deg, var(--primary-blue), var(--primary-green)); 
                                border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; 
                                color: white; font-size: 2.5rem; font-weight: bold;">
                        ${user.name.charAt(0).toUpperCase()}
                    </div>
                    <h3 class="mt-3" style="color: var(--dark-blue); font-weight: 700;">${user.name}</h3>
                    <p class="text-muted">${user.email}</p>
                    <span class="badge badge-info">${user.role.charAt(0).toUpperCase() + user.role.slice(1)}</span>
                </div>
                
                <div class="card p-4 mb-4">
                    <h4 class="mb-3" style="color: var(--dark-blue);">Edit Profile</h4>
                    <form id="profileForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" value="${user.name}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" value="${user.email}" disabled>
                            <small class="text-muted">Email cannot be changed</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" value="${user.phone || ''}" 
                                   placeholder="Enter your phone number">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Profile
                        </button>
                    </form>
                </div>
                
                <div class="card p-4">
                    <h4 class="mb-3" style="color: var(--dark-blue);">Change Password</h4>
                    <form id="passwordForm">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" id="currentPassword" 
                                   placeholder="Enter current password">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" 
                                   placeholder="Enter new password (min 6 characters)">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmNewPassword" 
                                   placeholder="Confirm new password">
                        </div>
                        
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-key"></i> Change Password
                        </button>
                    </form>
                </div>
            `;

            // Add event listeners
            document.getElementById('profileForm').addEventListener('submit', updateProfile);
            document.getElementById('passwordForm').addEventListener('submit', changePassword);
        }

        function updateProfile(e) {
            e.preventDefault();
            
            const token = localStorage.getItem('token');
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            fetch('/api/auth/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name, phone })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                localStorage.setItem('user', JSON.stringify(data.user));
                alert('Profile updated successfully');
                loadProfile();
            })
            .catch(error => {
                console.error('Error updating profile:', error);
                alert('Failed to update profile');
            });
        }

        function changePassword(e) {
            e.preventDefault();
            
            const token = localStorage.getItem('token');
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                alert('New passwords do not match');
                return;
            }

            if (newPassword.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            fetch('/api/auth/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ currentPassword, newPassword })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                alert('Password changed successfully');
                document.getElementById('passwordForm').reset();
            })
            .catch(error => {
                console.error('Error changing password:', error);
                alert('Failed to change password');
            });
        }
    </script>
</body>
</html>
